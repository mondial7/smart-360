{{define "pagination"}}
{{if .}}
{{if or .HasPrev .HasNext}}
<nav class="pagination" aria-label="Pagination">
  {{if .HasPrev}}<a class="btn btn--ghost btn--sm" href="{{.PrevURL}}">&larr; Prev</a>{{else}}<span></span>{{end}}
  <span class="muted-text">Page {{.Page}}</span>
  {{if .HasNext}}<a class="btn btn--ghost btn--sm" href="{{.NextURL}}">Next &rarr;</a>{{else}}<span></span>{{end}}
</nav>
{{end}}
{{end}}
{{end}}
