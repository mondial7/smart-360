{{define "teams_content"}}
<div class="page-head">
  <div><h1>Teams</h1><p class="muted-text">Manage teams and their members.</p></div>
  <a class="btn" href="/teams/new">New team</a>
</div>
{{if .Teams}}
<div class="grid grid--cards">
  {{range .Teams}}
  <div class="card">
    <h3 style="margin-bottom:0.25rem">{{.Team.Name}}</h3>
    <small>Admin: {{.AdminName}} · {{.Members}} member{{if ne .Members 1}}s{{end}}</small>
    <div style="margin-top:0.75rem"><a class="btn btn--ghost btn--sm" href="/teams/{{.Team.ID}}">Manage</a></div>
  </div>
  {{end}}
</div>
{{else}}
<div class="card"><p class="muted-text" style="margin:0">No teams yet.</p></div>
{{end}}
{{end}}
