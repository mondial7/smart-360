{{define "team_directory_content"}}
<div class="page-head"><div><h1>Team</h1><p class="muted-text">Everyone in the company.</p></div></div>
<div class="card">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Team</th></tr></thead>
    <tbody>
      {{range .Rows}}
      <tr>
        <td>{{.User.Name}}</td>
        <td><small>{{.User.Email}}</small></td>
        <td><span class="badge">{{.User.Role}}</span></td>
        <td>{{.Team}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
