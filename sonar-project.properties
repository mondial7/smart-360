# SonarQube / SonarCloud scanner configuration for Smart 360 Feedback.
#
# This project ships two top-level modules:
#   - backend/  Go 1.25 service (Gin + MongoDB)
#   - frontend/ Vue 3 + TypeScript SPA built with Vite
#
# Override `sonar.host.url` and `sonar.token` (or `sonar.login`) on the
# scanner command line / CI secrets — never commit credentials here.
#
# Typical invocation:
#   sonar-scanner \
#     -Dsonar.host.url=$SONAR_HOST_URL \
#     -Dsonar.token=$SONAR_TOKEN

# --- Project identity ---------------------------------------------------------
sonar.projectKey=mondial7_smart-360
sonar.projectName=Smart 360 Feedback
sonar.projectVersion=1.1.0
# If you use SonarCloud, also set:
# sonar.organization=<your-org>

# --- Sources & tests ----------------------------------------------------------
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src

# Go tests live alongside source as *_test.go; TS/Vue tests would live under
# frontend/src as *.spec.ts / *.test.ts once introduced (see NEXT_STEPS.md).
sonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js
sonar.test.exclusions=

# --- Exclusions ---------------------------------------------------------------
# Generated, vendored, and build output should not be analysed.
sonar.exclusions=\
    **/node_modules/**,\
    **/dist/**,\
    **/build/**,\
    **/coverage/**,\
    **/*.min.js,\
    backend/cmd/seed/**,\
    backend/scripts/**,\
    backend/testutil/**,\
    backend/repositories/fake_*.go,\
    frontend/public/**,\
    docs/**

sonar.coverage.exclusions=\
    **/*_test.go,\
    **/*.spec.ts,\
    **/*.test.ts,\
    backend/main.go,\
    backend/cmd/**,\
    backend/database/seed_dev.go,\
    backend/repositories/fake_*.go,\
    frontend/src/main.ts,\
    frontend/src/router/**,\
    frontend/src/types/**

# Duplication tends to be noisy in generated migration / seed code.
sonar.cpd.exclusions=\
    backend/database/seed_dev.go,\
    backend/scripts/**

# --- Encoding / SCM -----------------------------------------------------------
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# --- Go -----------------------------------------------------------------------
# Generate the coverage profile before scanning:
#   cd backend && go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=backend/coverage.out
# Optional: golangci-lint report in checkstyle format
# sonar.go.golangci-lint.reportPaths=backend/golangci-lint-report.xml

# --- TypeScript / JavaScript --------------------------------------------------
# When Vitest is wired up (see NEXT_STEPS.md #2), emit lcov to this path:
#   npx vitest run --coverage --coverage.reporter=lcov
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json
