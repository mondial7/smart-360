# SonarQube / SonarCloud scanner configuration for Smart 360 Feedback.
#
# Single Go module: a server-rendered web app (chi + html/template + Postgres).
#
# Override `sonar.host.url` and `sonar.token` on the scanner command line / CI
# secrets — never commit credentials here.
#
#   sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN

# --- Project identity ---------------------------------------------------------
sonar.projectKey=mondial7_smart-360
sonar.projectName=Smart 360 Feedback
sonar.projectVersion=1.2.0
# If you use SonarCloud, also set:
# sonar.organization=<your-org>

# --- Sources & tests ----------------------------------------------------------
sonar.sources=cmd,internal
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=

# --- Exclusions ---------------------------------------------------------------
sonar.exclusions=\
    **/node_modules/**,\
    **/dist/**,\
    **/build/**,\
    **/coverage/**,\
    **/*.min.js,\
    internal/repo/fakes.go,\
    web/**,\
    docs/**

sonar.coverage.exclusions=\
    **/*_test.go,\
    cmd/**,\
    internal/db/seed.go,\
    internal/repo/fakes.go

sonar.cpd.exclusions=\
    internal/db/migrations/**,\
    internal/db/seed.go

# --- Encoding / SCM -----------------------------------------------------------
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# --- Go -----------------------------------------------------------------------
# Generate the coverage profile before scanning:
#   go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out
