# Production compose: Postgres + the Smart 360 app.
#
# Unlike docker-compose.yml (which builds the app image from local source), this
# pulls a published image. Provide a .env with SESSION_SECRET, Google OAuth, and
# Gemini credentials, and a strong POSTGRES_PASSWORD.
#
#   SMART360_VERSION=v1.0.0 docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smart360}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart360-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart360}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/mondial7/smart-360:${SMART360_VERSION:-latest}
    container_name: smart360-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smart360}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart360}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL to bootstrap the admin}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEV_MODE: "false"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart360-network

volumes:
  postgres_data:
    driver: local

networks:
  smart360-network:
    driver: bridge
